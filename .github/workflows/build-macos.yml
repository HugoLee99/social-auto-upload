name: Build macOS DMG

on:
  # 手动触发（Actions 页面 → Run workflow）
  workflow_dispatch:
  push:
    # 打包相关改动合并进 main 时自动构建，产物留在 Actions Artifacts
    branches:
      - main
    # 打 v* 标签时构建并把 DMG 挂到 GitHub Release
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: DMG ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon 原生构建（macos-14 标签已不可用，改用 macos-15）
          - runner: macos-15
            arch: arm64
          # Intel 原生构建（macos-15-intel 是当前 Intel 标签）
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 仓库 .gitignore 忽略了 package-lock.json，这里不能开 npm 缓存，
          # 否则 setup-node 会因找不到 lockfile 直接失败。

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build DMG
        env:
          # 未配置 Secrets 时为空 → 脚本自动退回 ad-hoc 签名（内测可分发）
          DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x packaging/build-macos.sh packaging/macos/*.sh 2>/dev/null || true
          set -o pipefail
          ./packaging/build-macos.sh 2>&1 | tee build-macos.log

      # 构建失败时把日志推到一个独立分支，便于无 token 也能定位原因
      - name: Publish build log (diagnostics)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          mkdir -p .ci-logs
          tail -n 500 build-macos.log > ".ci-logs/build-${{ matrix.arch }}.log" 2>/dev/null || echo "no log captured" > ".ci-logs/build-${{ matrix.arch }}.log"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan "ci-tmp-${{ matrix.arch }}" || git checkout "ci-tmp-${{ matrix.arch }}"
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f ".ci-logs/build-${{ matrix.arch }}.log"
          git commit -m "ci: build log ${{ matrix.arch }} run ${{ github.run_id }}" || true
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:ci-logs" || echo "log push failed"

      - name: Show result
        run: |
          ls -lh release/*.dmg
          shasum -a 256 release/*.dmg | tee release/SHA256SUMS-macos.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaydreamDispatch-macOS-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach to Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
